<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Contador Raphástico</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      transition: background 0.5s;
    }
    .oculto { display: none; }
    .temblor { animation: temblor 0.3s; }
    .temblorGlobal { animation: temblorGlobal 0.8s infinite; }
    .victoria { background-color: #00cc00 !important; color: black; }
    .ritmo { animation: vibrar 0.3s infinite ease-in-out; }
    #numero { margin-bottom: 10px; }
    #cuentaRegresiva { font-size: 40px; color: orangered; text-shadow: 1px 1px 4px black; }
    #mensajeVictoria {
      position: absolute; top: 20%;
      font-size: 80px; color: yellow;
      text-shadow: 4px 4px 0 black;
      animation: parpadeo 1s infinite;
      z-index: 10;
    }
    #emblemasVitrina {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      display: flex; flex-wrap: wrap;
      justify-content: center; gap: 10px;
      font-size: 20px; z-index: 5;
    }
    #notificacionEmblema {
      position: fixed; bottom: 10px; left: 10px;
      font-size: 22px; padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      color: gold; border: 2px solid gold;
      border-radius: 10px; display: none;
      animation: fadeout 3s ease-out forwards;
      z-index: 10;
    }
    #botonConfiguracion {
      position: fixed; top: 10px; left: 10px;
      font-size: 24px; background: white; color: black;
      padding: 5px 15px; border-radius: 10px;
      border: none; cursor: pointer; z-index: 10;
    }
    #botonVerEmblemas {
      position: fixed; top: 10px; right: 10px;
      font-size: 20px; background: white; color: black;
      padding: 5px 15px; border-radius: 10px;
      border: none; cursor: pointer; z-index: 10;
    }
    #panelEmblemas {
      position: fixed; top: 60px; right: 10px;
      background: rgba(0,0,0,0.95); color: white;
      padding: 15px; border-radius: 10px;
      font-size: 18px; max-height: 80vh;
      overflow-y: auto; display: none;
      z-index: 9; border: 1px solid white;
      width: 300px;
    }
    #listaEmblemas { margin-bottom: 20px; }
    #panelConfiguracion { border-top: 1px solid white; padding-top: 10px; }
    .configItem { margin-bottom: 15px; }
    .configItem label { display: block; font-size: 16px; margin-bottom: 5px; }
    .configItem input[type="range"] { width: 100%; }
    .configItem button {
      font-size: 16px; padding: 5px 15px;
      background: crimson; color: white;
      border: none; border-radius: 8px;
      cursor: pointer; width: 100%;
    }
    @keyframes parpadeo { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.1);} }
    @keyframes vibrar { 0%,100%{transform:translate(0,0);}25%{transform:translate(3px,-3px);}50%{transform:translate(-3px,3px);}75%{transform:translate(3px,3px);} }
    @keyframes temblor { 0%,100%{transform:translate(0,0);}25%{transform:translate(4px,-4px);}50%{transform:translate(-4px,4px);}75%{transform:translate(4px,4px);} }
    @keyframes temblorGlobal { 0%{transform:translate(0,0);}25%{transform:translate(8px,-8px);}50%{transform:translate(-8px,8px);}75%{transform:translate(8px,8px);}100%{transform:translate(0,0);} }
    @keyframes fadeout { 0%{opacity:1;}75%{opacity:1;}100%{opacity:0;display:none;} }
    button { font-family:'Bebas Neue',sans-serif; font-size:30px; padding:10px 40px; border:none; border-radius:12px; background:white; color:black; cursor:pointer; z-index:1; }
    canvas { position:fixed; top:0; left:0; pointer-events:none; z-index:0; }
  </style>
</head>
<body>
  <div id="numero" class="oculto">0</div>
  <div id="cuentaRegresiva" class="oculto">5</div>
  <div id="mensajeVictoria" class="oculto">¡GANASTE!</div>

  <button id="empezar" onclick="iniciarJuego()">Empezar a jugar</button>
  <button id="reiniciar" class="oculto" onclick="reiniciar(event)">Volver a jugar</button>

  <button id="botonConfiguracion" onclick="mostrarOcultarPanel()">⚙</button>
  <button id="botonVerEmblemas" onclick="mostrarOcultarPanelEmblemas()">Emblemas</button>

  <div id="panelEmblemas">
    <div id="listaEmblemas"></div>
    <div id="panelConfiguracion" class="oculto">
      <div class="configItem">
        <label for="volumenMusica">Volumen de Música:</label>
        <input type="range" id="volumenMusica" min="0" max="1" step="0.01" value="1" />
      </div>
      <div class="configItem">
        <label for="volumenSFX">Volumen de SFX:</label>
        <input type="range" id="volumenSFX" min="0" max="1" step="0.01" value="1" />
      </div>
      <div class="configItem">
        <button onclick="reiniciarEmblemas()">🔁 Reiniciar emblemas</button>
      </div>
    </div>
  </div>

  <div id="notificacionEmblema"></div>
  <div id="emblemasVitrina"></div>

  <!-- Audios -->
  <audio id="musicaFondo" src="fondoo.mp3" loop preload="auto"></audio>
  <audio id="musica666" src="musica666.mp3" loop preload="auto"></audio>
  <audio id="musicaVictoria" src="victoria.mp3" loop preload="auto"></audio>
  <audio id="sonidoFinal" src="final.mp3" preload="auto"></audio>
  <audio id="sonidoEmblema" src="emblema.mp3" preload="auto"></audio>
  <audio id="sonidoMisterio" src="misterio.mp3" preload="auto"></audio>
  <audio id="sonidoCompletos" src="emblemas_completos.mp3" preload="auto"></audio>

  <!-- Sonidos de clic -->
  <audio id="click1" src="click1.mp3" preload="auto"></audio>
  <audio id="click2" src="click2.mp3" preload="auto"></audio>
  <audio id="click3" src="click3.mp3" preload="auto"></audio>
  <audio id="click4" src="click4.mp3" preload="auto"></audio>
  <audio id="click5" src="click5.mp3" preload="auto"></audio>
  <audio id="click6" src="click6.mp3" preload="auto"></audio>
  <audio id="click7" src="click7.mp3" preload="auto"></audio>
  <audio id="click8" src="click8.mp3" preload="auto"></audio>

  <!-- Canvas para confeti -->
  <canvas id="confetiCanvas"></canvas>

  <!-- Video del evento 666 -->
  <video id="video666" class="oculto">
    <source src="video666.mp4" type="video/mp4" />
  </video>

  <!-- Script del juego -->
  <script>
    /* Aquí va el script completo que te pasé antes (Bloque 3, 4 y 5 integrados).
       Incluye:
       - iniciarJuego()
       - mostrarOcultarPanel()
       - mostrarOcultarPanelEmblemas()
       - actualizarPanelEmblemas()
       - control de volumen
       - cookies para emblemas
       - mostrarVideo666()
       - reiniciar()
       - lanzarConfeti()
       - soporte para click y touchstart
    */
  </script>
</body>
</html>
