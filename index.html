<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clicker Raphástico</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      transition: background 0.5s;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
    }

    .oculto { display: none !important; }
    .blur { filter: blur(5px); transition: filter 0.3s; }
    .temblor { animation: temblor 0.3s; }
    .rojo { background-color: red !important; }
    .victoria { background-color: #00cc00 !important; color: black; }
    .ritmo { animation: vibrar 0.3s infinite ease-in-out; }
    .temblorFinal { animation: temblorFinal 0.1s infinite; }

    @keyframes temblorFinal {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-5px, 3px) rotate(-0.5deg); }
      20% { transform: translate(5px, -3px) rotate(0.5deg); }
      30% { transform: translate(-3px, 5px) rotate(-0.3deg); }
      40% { transform: translate(3px, -5px) rotate(0.3deg); }
      50% { transform: translate(-5px, -3px) rotate(-0.5deg); }
      60% { transform: translate(5px, 3px) rotate(0.5deg); }
      70% { transform: translate(-3px, -5px) rotate(-0.3deg); }
      80% { transform: translate(3px, 5px) rotate(0.3deg); }
      90% { transform: translate(-5px, 3px) rotate(-0.5deg); }
    }

    #numero {
      font-size: 150px;
      margin-bottom: 30px;
      text-shadow: 0 0 30px rgba(255,255,255,0.3);
      z-index: 2;
      transition: transform 0.1s;
      min-width: 200px;
      text-align: center;
    }
    #numero.saltar {
      animation: saltar 0.2s ease;
    }

    @keyframes saltar {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); color: #ffcc00; }
      100% { transform: scale(1); }
    }

    #mensajeVictoria {
      position: absolute;
      top: 20%;
      font-size: 80px;
      color: yellow;
      text-shadow: 4px 4px 0 black;
      animation: parpadeo 1s infinite;
      z-index: 10;
    }

    /* TEMPORIZADOR 666 - Abajo del número */
    #temporizador666 {
      position: fixed;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 60px;
      color: #ff4444;
      z-index: 20;
      text-shadow: 0 0 30px rgba(255,68,68,0.8);
      animation: parpadeoRapido 0.5s infinite;
      background: rgba(0,0,0,0.8);
      padding: 10px 30px;
      border-radius: 15px;
      border: 3px solid #ff4444;
      font-family: 'Bebas Neue', sans-serif;
    }

    @keyframes parpadeoRapido {
      0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.5; transform: translateX(-50%) scale(1.05); }
    }

    #cuentaRegresiva {
      font-size: 40px;
      color: orangered;
      text-shadow: 1px 1px 4px black;
      z-index: 2;
    }

    /* NOTIFICACIÓN DE EMBLEMA - Esquina inferior derecha */
    #notificacionEmblema {
      position: fixed;
      bottom: 30px;
      right: 30px;
      font-size: 24px;
      padding: 12px 25px;
      background: rgba(0,0,0,0.95);
      color: gold;
      border: 3px solid gold;
      border-radius: 12px;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transform: translateX(100px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      text-align: center;
      max-width: 350px;
      font-family: 'Bebas Neue', sans-serif;
      box-shadow: 0 0 30px rgba(255,215,0,0.2);
    }
    #notificacionEmblema.mostrar {
      opacity: 1;
      transform: translateX(0);
    }
    #notificacionEmblema .subtexto {
      font-size: 14px;
      color: #aaa;
      margin-top: 3px;
    }

    #botonVerEmblemas {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 20px;
      background: white;
      color: black;
      padding: 5px 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      z-index: 10;
      font-family: 'Bebas Neue', sans-serif;
    }
    #botonVerEmblemas:hover {
      transform: scale(1.05);
    }

    #botonConfiguracion {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 24px;
      background: white;
      color: black;
      padding: 5px 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      z-index: 10;
      font-family: 'Bebas Neue', sans-serif;
    }
    #botonConfiguracion:hover {
      transform: scale(1.05);
    }

    #panelEmblemas {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.95);
      color: white;
      padding: 20px;
      border-radius: 15px;
      font-size: 18px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
      z-index: 20;
      border: 2px solid #ff4444;
      min-width: 300px;
      width: 90%;
      max-width: 400px;
    }

    #panelEmblemas .configItem {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #panelEmblemas input[type="range"] {
      flex: 1;
      min-width: 100px;
    }

    #panelEmblemas button {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      padding: 5px 15px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #panelEmblemas button:hover {
      transform: scale(1.05);
    }

    #listaEmblemas {
      margin-bottom: 15px;
      font-size: 16px;
      line-height: 1.8;
    }
    #listaEmblemas strong {
      font-size: 20px;
      color: #ffdd00;
    }

    .contador-info {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      color: #888;
      z-index: 2;
      background: rgba(0,0,0,0.5);
      padding: 5px 15px;
      border-radius: 20px;
    }

    @keyframes parpadeo {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }

    @keyframes vibrar {
      0%,100% { transform: translate(0,0); }
      25% { transform: translate(3px,-3px); }
      50% { transform: translate(-3px,3px); }
      75% { transform: translate(3px,3px); }
    }

    @keyframes temblor {
      0%,100% { transform: translate(0,0); }
      25% { transform: translate(4px,-4px); }
      50% { transform: translate(-4px,4px); }
      75% { transform: translate(4px,4px); }
    }

    @keyframes subir {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }

    button {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      padding: 10px 40px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
      z-index: 5;
      margin: 5px;
      transition: transform 0.3s;
    }
    button:hover {
      transform: scale(1.05);
    }

    #empezar { background: #ff4444; color: white; }
    #reiniciar { background: #4444ff; color: white; }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    #video666 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      object-fit: cover;
      display: none;
    }
    #video666:not(.oculto) {
      display: block;
    }

    .barras-cine::before,
    .barras-cine::after {
      content: '';
      position: fixed;
      left: 0;
      right: 0;
      background: black;
      height: 130px;
      z-index: 9998;
    }
    .barras-cine::before { top: 0; }
    .barras-cine::after { bottom: 0; }
    
    @keyframes scrollCreditos {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }
  </style>
</head>
<body>
  <div id="numero" class="oculto">0</div>
  <div id="mensajeVictoria" class="oculto">¡GANASTE!</div>
  <div id="cuentaRegresiva" class="oculto">5</div>

  <!-- TEMPORIZADOR 666 -->
  <div id="temporizador666" class="oculto">⏱ 5</div>

  <button id="empezar">Empezar a jugar</button>
  <button id="reiniciar" class="oculto">Volver a jugar</button>
  <button id="botonVerEmblemas">Emblemas</button>
  <button id="botonConfiguracion">⚙</button>

  <div id="panelEmblemas">
    <div id="listaEmblemas"></div>
    <div id="panelConfiguracion" class="oculto">
      <div class="configItem">
        <label for="volumenMusica">Volumen Música:</label>
        <input type="range" id="volumenMusica" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="configItem">
        <label for="volumenSFX">Volumen SFX:</label>
        <input type="range" id="volumenSFX" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="configItem">
        <button onclick="reiniciarEmblemas()">🔁 Reiniciar emblemas</button>
      </div>
    </div>
  </div>

  <div id="notificacionEmblema">
    <div id="notificacionTexto">🏆 ¡Emblema desbloqueado!</div>
    <div class="subtexto" id="notificacionSubtexto"></div>
  </div>
  
  <div class="contador-info" id="contadorInfo">Contando de 10 en 10</div>

  <!-- Audios -->
  <audio id="musicaFondo" src="fondoo.mp3" loop preload="auto"></audio>
  <audio id="musica666" src="musica666.mp3" preload="auto"></audio>
  <audio id="musicaVictoria" src="victoria.mp3" loop preload="auto"></audio>
  <audio id="sonidoFinal" src="final.mp3" preload="auto"></audio>
  <audio id="sonidoEmblema" src="emblema.mp3" preload="auto"></audio>
  <audio id="sonidoMisterio" src="misterio.mp3" preload="auto"></audio>

  <audio id="click1" src="click1.mp3" preload="auto"></audio>
  <audio id="click2" src="click2.mp3" preload="auto"></audio>
  <audio id="click3" src="click3.mp3" preload="auto"></audio>
  <audio id="click4" src="click4.mp3" preload="auto"></audio>
  <audio id="click5" src="click5.mp3" preload="auto"></audio>
  <audio id="click6" src="click6.mp3" preload="auto"></audio>
  <audio id="click7" src="click7.mp3" preload="auto"></audio>
  <audio id="click8" src="click8.mp3" preload="auto"></audio>

  <canvas id="confetiCanvas"></canvas>

  <video id="video666" class="oculto">
    <source src="video666.mp4" type="video/mp4" />
  </video>

  <script>
    // ============================================================
    //  TODAS LAS VARIABLES GLOBALES
    // ============================================================
    let contador = 0;
    let juegoActivo = false;
    let clickActual = 0;
    let tiempoClickRapido = [];
    let tiempoClickUltra = [];
    let victorias = 0;
    let tiempoPaciencia = null;
    let esperaPaciencia = null;
    let emblemasObtenidos = {};
    let creditosYaMostrados = false;
    let evento666Activado = false;
    let musicaInterrumpida = false;
    let yaGanoBronce = false;
    let temporizador666Activo = false;
    let temporizador666Interval = null;
    let tiempoRestante666 = 5;
    let evento666Cancelado = false;
    let juegoTerminado = false;
    let musica666Reproducida = false;
    let temblorFinalActivo = false;

    // ============================================================
    //  REFERENCIAS DOM
    // ============================================================
    const numero = document.getElementById("numero");
    const mensaje = document.getElementById("mensajeVictoria");
    const btnEmpezar = document.getElementById("empezar");
    const btnReiniciar = document.getElementById("reiniciar");
    const panelEmblemas = document.getElementById("panelEmblemas");
    const panelConfig = document.getElementById("panelConfiguracion");
    const notificacion = document.getElementById("notificacionEmblema");
    const notificacionTexto = document.getElementById("notificacionTexto");
    const notificacionSubtexto = document.getElementById("notificacionSubtexto");
    const contadorInfo = document.getElementById("contadorInfo");
    const cuentaRegresiva = document.getElementById("cuentaRegresiva");
    const temporizador666 = document.getElementById("temporizador666");

    const canvas = document.getElementById("confetiCanvas");
    const ctx = canvas.getContext("2d");

    // ============================================================
    //  REFERENCIAS DE AUDIO
    // ============================================================
    const sonidosClick = [
      document.getElementById("click1"),
      document.getElementById("click2"),
      document.getElementById("click3"),
      document.getElementById("click4"),
      document.getElementById("click5"),
      document.getElementById("click6"),
      document.getElementById("click7"),
      document.getElementById("click8")
    ];
    const musicaFondo = document.getElementById("musicaFondo");
    const musica666 = document.getElementById("musica666");
    const musicaVictoria = document.getElementById("musicaVictoria");
    const sonidoFinal = document.getElementById("sonidoFinal");
    const sonidoEmblema = document.getElementById("sonidoEmblema");
    const sonidoMisterio = document.getElementById("sonidoMisterio");

    // Quitar loop de musica666
    musica666.loop = false;

    // ============================================================
    //  LISTA DE EMBLEMAS (con nombre oculto para 666)
    // ============================================================
    const listaEmblemas = [
      "🥇 Medalla de Bronce",
      "🔥 Dedo Rápido",
      "💎 Diamante Triple",
      "🎮 Casi Casi Gamer",
      "⚡ Velocidad Loca",
      "🕒 Paciencia Infinita",
      "???", // 666 - se muestra como ??? hasta desbloquear
      "🏁 Meta Suprema"
    ];

    const nombreReal666 = "👹 No Confíes En 666";

    // ============================================================
    //  FUNCIÓN PARA MOSTRAR NOTIFICACIÓN
    // ============================================================
    function mostrarNotificacion(texto, subtexto = "") {
      notificacionTexto.textContent = texto;
      notificacionSubtexto.textContent = subtexto;
      notificacion.classList.add("mostrar");
      
      if (window.notificacionTimeout) {
        clearTimeout(window.notificacionTimeout);
      }
      
      window.notificacionTimeout = setTimeout(() => {
        notificacion.classList.remove("mostrar");
      }, 4000);
    }

    // ============================================================
    //  TEMPORIZADOR 666
    // ============================================================
    function iniciarTemporizador666() {
      if (temporizador666Activo) return;
      
      temporizador666Activo = true;
      evento666Cancelado = false;
      tiempoRestante666 = 5;
      temporizador666.classList.remove("oculto");
      temporizador666.textContent = `⏱ ${tiempoRestante666}`;
      
      // Pausar música de fondo
      musicaFondo.pause();
      
      // Reproducir música 666 (sin loop)
      musica666.volume = parseFloat(document.getElementById("volumenMusica").value);
      musica666.currentTime = 0;
      musica666.play().catch(() => {});
      musica666Reproducida = true;
      
      // Sonido de alerta
      const sonido = sonidosClick[0];
      if (sonido) {
        sonido.currentTime = 0;
        sonido.volume = parseFloat(document.getElementById("volumenSFX").value);
        sonido.play().catch(() => {});
      }
      
      temporizador666Interval = setInterval(() => {
        tiempoRestante666--;
        temporizador666.textContent = `⏱ ${tiempoRestante666}`;
        
        // Sonido cada segundo
        const sonidoTick = sonidosClick[clickActual % sonidosClick.length];
        if (sonidoTick) {
          sonidoTick.currentTime = 0;
          sonidoTick.volume = parseFloat(document.getElementById("volumenSFX").value) * 0.5;
          sonidoTick.play().catch(() => {});
        }
        
        if (tiempoRestante666 <= 0) {
          clearInterval(temporizador666Interval);
          temporizador666Interval = null;
          temporizador666.classList.add("oculto");
          temporizador666Activo = false;
          
          // Si no fue cancelado, activar el evento 666
          if (!evento666Cancelado) {
            activarEvento666();
          }
        }
      }, 1000);
    }

    function cancelarTemporizador666() {
      if (temporizador666Interval) {
        clearInterval(temporizador666Interval);
        temporizador666Interval = null;
      }
      temporizador666.classList.add("oculto");
      temporizador666Activo = false;
      evento666Cancelado = true;
      
      // Detener música 666
      musica666.pause();
      musica666.currentTime = 0;
      musica666Reproducida = false;
      
      // Reanudar música de fondo
      musicaFondo.volume = parseFloat(document.getElementById("volumenMusica").value);
      musicaFondo.currentTime = 0;
      musicaFondo.play().catch(() => {});
      
      mostrarNotificacion("⚠️ Has saltado el 666", "El evento ha sido cancelado");
    }

    // ============================================================
    //  ACTIVAR EVENTO 666
    // ============================================================
    function activarEvento666() {
      if (evento666Activado) return;
      evento666Activado = true;
      
      const video = document.getElementById("video666");
      video.classList.remove("oculto");
      video.style.display = "block";

      // La música 666 ya está sonando, la dejamos sonar durante el video

      video.play().catch(() => {});
      video.onended = () => {
        video.classList.add("oculto");
        video.style.display = "none";
        document.body.style.backgroundColor = "black";

        // Detener música 666
        musica666.pause();
        musica666.currentTime = 0;
        musica666Reproducida = false;

        const imagenFinal = document.createElement("img");
        imagenFinal.src = "final666.png";
        Object.assign(imagenFinal.style, {
          position: "fixed",
          top: "50%",
          left: "50%",
          transform: "translate(-50%, -50%)",
          maxWidth: "90vw",
          maxHeight: "90vh",
          zIndex: "999",
          opacity: "0",
          transition: "opacity 2s ease-in-out"
        });

        document.body.appendChild(imagenFinal);

        sonidoMisterio.currentTime = 0;
        sonidoMisterio.volume = parseFloat(document.getElementById("volumenSFX").value);
        sonidoMisterio.play().catch(() => {});

        setTimeout(() => {
          imagenFinal.style.opacity = "1";
        }, 100);

        setTimeout(() => {
          desbloquearEmblema666();
        }, 3000);

        setTimeout(() => {
          imagenFinal.remove();
          // NO REANUDAR música de fondo después del evento 666
          evento666Activado = false;
        }, 8000);
      };
    }

    // ============================================================
    //  DESBLOQUEAR EMBLEMA 666 (reemplaza "???" por nombre real)
    // ============================================================
    function desbloquearEmblema666() {
      // Reemplazar "???" por el nombre real en la lista
      const index = listaEmblemas.indexOf("???");
      if (index !== -1) {
        listaEmblemas[index] = nombreReal666;
      }
      
      if (emblemasObtenidos[nombreReal666]) return;
      emblemasObtenidos[nombreReal666] = true;

      mostrarNotificacion(`👹 ¡${nombreReal666}!`, "El misterio ha sido revelado");

      sonidoEmblema.playbackRate = 1;
      sonidoEmblema.currentTime = 0;
      sonidoEmblema.volume = parseFloat(document.getElementById("volumenSFX").value);
      sonidoEmblema.play().catch(() => {});

      actualizarPanelEmblemas();

      // Verificar si todos los emblemas están completos (excluyendo Meta Suprema)
      const emblemasNormales = listaEmblemas.filter(e => e !== "🏁 Meta Suprema");
      const todosObtenidos = emblemasNormales.every(e => emblemasObtenidos[e]);
      
      if (todosObtenidos && !creditosYaMostrados) {
        if (!emblemasObtenidos["🏁 Meta Suprema"]) {
          emblemasObtenidos["🏁 Meta Suprema"] = true;
          mostrarNotificacion("🏁 ¡Meta Suprema!", "¡Has completado todos los emblemas!");
          actualizarPanelEmblemas();
        }
        creditosYaMostrados = true;
        iniciarCreditosFinales();
      }
    }

    // ============================================================
    //  DESBLOQUEAR EMBLEMA NORMAL
    // ============================================================
    function desbloquearEmblema(nombre) {
      if (emblemasObtenidos[nombre]) return;
      emblemasObtenidos[nombre] = true;

      mostrarNotificacion(`🏆 ¡${nombre}!`, "Nuevo emblema desbloqueado");

      sonidoEmblema.playbackRate = 1;
      sonidoEmblema.currentTime = 0;
      sonidoEmblema.volume = parseFloat(document.getElementById("volumenSFX").value);
      sonidoEmblema.play().catch(() => {});

      actualizarPanelEmblemas();

      // Verificar si todos los emblemas están completos (excluyendo Meta Suprema)
      const emblemasNormales = listaEmblemas.filter(e => e !== "🏁 Meta Suprema");
      const todosObtenidos = emblemasNormales.every(e => emblemasObtenidos[e]);
      
      if (todosObtenidos && !creditosYaMostrados) {
        if (!emblemasObtenidos["🏁 Meta Suprema"]) {
          emblemasObtenidos["🏁 Meta Suprema"] = true;
          mostrarNotificacion("🏁 ¡Meta Suprema!", "¡Has completado todos los emblemas!");
          actualizarPanelEmblemas();
        }
        creditosYaMostrados = true;
        iniciarCreditosFinales();
      }
    }

    // ============================================================
    //  ACTUALIZAR PANEL DE EMBLEMAS
    // ============================================================
    function actualizarPanelEmblemas() {
      const lista = document.getElementById("listaEmblemas");
      lista.innerHTML = "<strong>🏅 Emblemas:</strong><br><br>";
      listaEmblemas.forEach(nombre => {
        const desbloqueado = emblemasObtenidos[nombre];
        let displayNombre = nombre;
        if (nombre === "???" && !desbloqueado) {
          displayNombre = "??? (Misterio)";
        }
        lista.innerHTML += desbloqueado
          ? `✨ ${displayNombre}<br>`
          : `⛔ ${displayNombre}<br>`;
      });
    }

    // ============================================================
    //  MOSTRAR/OCULTAR PANEL
    // ============================================================
    function mostrarOcultarPanel() {
      const display = panelEmblemas.style.display;
      if (display === "block") {
        panelEmblemas.style.display = "none";
      } else {
        panelEmblemas.style.display = "block";
        panelConfig.classList.add("oculto");
        actualizarPanelEmblemas();
      }
    }

    // ============================================================
    //  MOSTRAR/OCULTAR CONFIGURACIÓN
    // ============================================================
    function mostrarOcultarConfiguracion() {
      const display = panelEmblemas.style.display;
      if (display === "block") {
        panelEmblemas.style.display = "none";
      } else {
        panelEmblemas.style.display = "block";
        panelConfig.classList.remove("oculto");
        actualizarPanelEmblemas();
      }
    }

    // ============================================================
    //  REINICIAR EMBLEMAS
    // ============================================================
    function reiniciarEmblemas() {
      emblemasObtenidos = {};
      creditosYaMostrados = false;
      yaGanoBronce = false;
      
      // Restaurar "???" en la lista si fue reemplazado
      const index666 = listaEmblemas.indexOf(nombreReal666);
      if (index666 !== -1) {
        listaEmblemas[index666] = "???";
      }
      
      actualizarPanelEmblemas();
      mostrarNotificacion("🔄 Emblemas reiniciados", "Todos los emblemas se han reiniciado");
    }

    // ============================================================
    //  LANZAR CONFETI
    // ============================================================
    function lanzarConfeti() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const confetis = [];

      for (let i = 0; i < 250; i++) {
        confetis.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 10 + 10,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          tilt: Math.random() * 10 - 5,
          tiltAngle: 0
        });
      }

      let frameId;

      function animar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activo = false;
        for (let c of confetis) {
          ctx.beginPath();
          ctx.lineWidth = c.r;
          ctx.strokeStyle = c.color;
          ctx.moveTo(c.x + c.tilt, c.y);
          ctx.lineTo(c.x + c.tilt + c.r / 2, c.y + c.d);
          ctx.stroke();
          c.y += 4;
          c.tiltAngle += 0.1;
          c.tilt = Math.sin(c.tiltAngle) * 10;
          if (c.y < canvas.height + 100) activo = true;
        }
        if (activo) {
          frameId = requestAnimationFrame(animar);
        }
      }

      animar();
    }

    // ============================================================
    //  CRÉDITOS FINALES (con los textos solicitados)
    // ============================================================
    function iniciarCreditosFinales() {
      if (document.getElementById("creditosActivos")) return;

      const overlay = document.createElement("div");
      overlay.id = "creditosActivos";
      overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      `;
      overlay.classList.add("barras-cine");

      const creditos = document.createElement("div");
      creditos.style.cssText = `
        color: white;
        font-size: 28px;
        text-align: center;
        animation: scrollCreditos 20s linear forwards;
        font-family: 'Bebas Neue', sans-serif;
        padding: 20px;
        line-height: 1.6;
      `;
      const año = new Date().getFullYear();
      creditos.innerHTML = `
        🎬 <br><br>
        <strong>Creador:</strong> Raphapro900<br>
        <strong>Música:</strong> Ezequiel David Urbano, Suno AI<br>
        <strong>Script:</strong> Copilot AI, DeepSeek<br><br>
        <em style="font-size: 20px; color: #aaa;">
          "La idea es que vi un contador de Eze Martinez<br>
          y quise hacer uno y quise ponerle muchas cosas<br>
          como un juego parecido a My Name Is Mayo<br>
          con emblemas y eso :)"<br><br>
        </em>
        <strong>Inició el proyecto en 2025 y sigue actualizándose este ${año}</strong><br><br>
        ¡Gracias por jugar! 🎮<br><br>
        <span style="font-size: 18px; color: #888;">
          CCO Raphapro900 - Counter v1.0
        </span>
      `;
      overlay.appendChild(creditos);
      document.body.appendChild(overlay);

      musicaFondo.playbackRate = 0.7;

      setTimeout(() => {
        document.body.removeChild(overlay);
        musicaFondo.playbackRate = 1.0;
      }, 20000);
    }

    // ============================================================
    //  FUNCIÓN CONTAR (PRINCIPAL)
    // ============================================================
    function contar(e) {
      // Si el juego terminó o ya se llegó a 1000, no hacer nada
      if (!juegoActivo || evento666Activado || juegoTerminado) return;
      
      if (e.target.tagName === "BUTTON") return;

      // Si el temporizador 666 está activo y se hace clic, cancelar
      if (temporizador666Activo) {
        cancelarTemporizador666();
        // Continuar con el conteo normal
      }

      // Efecto visual
      document.body.classList.add("temblor", "rojo", "blur");
      setTimeout(() => {
        document.body.classList.remove("temblor", "rojo", "blur");
      }, 200);

      // Contador: de 660 pasa a 666, luego a 670
      if (contador === 660) {
        contador = 666;
      } else {
        contador += 10;
      }
      
      // Si pasamos de 1000, lo limitamos a 1000
      if (contador > 1000) {
        contador = 1000;
      }
      
      numero.textContent = contador;

      // Efecto salto
      numero.classList.remove("saltar");
      void numero.offsetWidth;
      numero.classList.add("saltar");

      // Sonido click
      const sonido = sonidosClick[clickActual];
      if (sonido) {
        sonido.currentTime = 0;
        sonido.volume = parseFloat(document.getElementById("volumenSFX").value);
        sonido.play().catch(() => {});
      }
      clickActual = (clickActual + 1) % sonidosClick.length;

      // Mostrar incremento
      let incrementoTexto = "+10";
      if (contador === 666) {
        incrementoTexto = "+6";
      }
      const incremento = document.createElement("div");
      incremento.textContent = incrementoTexto;
      incremento.style.cssText = `
        position: fixed;
        font-size: 40px;
        color: #ffcc00;
        z-index: 15;
        pointer-events: none;
        animation: subir 1s ease forwards;
        left: ${e.clientX || window.innerWidth/2}px;
        top: ${e.clientY || window.innerHeight/2}px;
        font-family: 'Bebas Neue', sans-serif;
      `;
      document.body.appendChild(incremento);
      setTimeout(() => incremento.remove(), 1000);

      // ⭐ TEMBLOR FINAL - cuando se acerca al final (a partir de 900)
      if (contador >= 900 && contador < 1000 && !temblorFinalActivo) {
        temblorFinalActivo = true;
        document.body.classList.add("temblorFinal");
      } else if (contador >= 1000) {
        document.body.classList.remove("temblorFinal");
        temblorFinalActivo = false;
      }

      // ⭐ INICIAR TEMPORIZADOR 666 (si llegamos a 666)
      if (contador === 666 && !evento666Activado && !temporizador666Activo) {
        iniciarTemporizador666();
        return; // No procesar más este clic
      }

      // Si llegamos a 1000, finalizar el juego
      if (contador === 1000 && !juegoTerminado) {
        juegoTerminado = true;
        juegoActivo = false;
        
        // Quitar temblor final
        document.body.classList.remove("temblorFinal");
        temblorFinalActivo = false;
        
        // Medalla de Bronce - primera vez que llega a 1000
        if (!yaGanoBronce) {
          yaGanoBronce = true;
          desbloquearEmblema("🥇 Medalla de Bronce");
        }
        
        sonidoFinal.volume = parseFloat(document.getElementById("volumenSFX").value);
        sonidoFinal.play().catch(() => {});
        
        // Si la música 666 se reprodujo, no reanudar fondo
        if (!musica666Reproducida) {
          musicaFondo.pause();
        }
        
        musicaVictoria.volume = parseFloat(document.getElementById("volumenMusica").value);
        musicaVictoria.currentTime = 0;
        musicaVictoria.play().catch(() => {});
        document.body.classList.add("victoria", "ritmo");
        mensaje.classList.remove("oculto");
        btnReiniciar.classList.remove("oculto");
        lanzarConfeti();
        victorias++;
        if (victorias === 3) desbloquearEmblema("💎 Diamante Triple");
        contadorInfo.style.display = "none";
        
        // Verificar todos los emblemas
        const emblemasNormales = listaEmblemas.filter(e => e !== "🏁 Meta Suprema");
        const todosObtenidos = emblemasNormales.every(e => emblemasObtenidos[e]);
        
        if (todosObtenidos && !creditosYaMostrados) {
          if (!emblemasObtenidos["🏁 Meta Suprema"]) {
            emblemasObtenidos["🏁 Meta Suprema"] = true;
            mostrarNotificacion("🏁 ¡Meta Suprema!", "¡Has completado todos los emblemas!");
            actualizarPanelEmblemas();
          }
          creditosYaMostrados = true;
          iniciarCreditosFinales();
        }
        
        return; // No seguir procesando
      }

      // Verificar emblemas (excepto los que ya se verifican en 1000)
      if (contador < 1000) {
        const ahora = Date.now();
        tiempoClickRapido.push(ahora);
        tiempoClickUltra.push(ahora);
        tiempoClickRapido = tiempoClickRapido.filter(t => ahora - t < 10000);
        tiempoClickUltra = tiempoClickUltra.filter(t => ahora - t < 2000);

        if (tiempoClickRapido.length >= 20) desbloquearEmblema("⚡ Velocidad Loca");
        if (tiempoClickUltra.length >= 10) desbloquearEmblema("🔥 Dedo Rápido");
        if (contador === 990) desbloquearEmblema("🎮 Casi Casi Gamer");

        // Paciencia Infinita - 30 segundos
        if (contador === 300 && !esperaPaciencia) {
          tiempoPaciencia = Date.now();
          esperaPaciencia = setTimeout(() => {
            if (contador === 300) desbloquearEmblema("🕒 Paciencia Infinita");
          }, 30000);
        } else if (contador !== 300) {
          clearTimeout(esperaPaciencia);
          esperaPaciencia = null;
        }
      }
    }

    // ============================================================
    //  INICIAR JUEGO
    // ============================================================
    function iniciarJuego() {
      btnEmpezar.classList.add("oculto");
      numero.classList.remove("oculto");
      numero.textContent = "0";
      contador = 0;
      juegoActivo = true;
      juegoTerminado = false;
      musica666Reproducida = false;
      temblorFinalActivo = false;
      document.body.classList.remove("temblorFinal");
      
      musicaFondo.volume = parseFloat(document.getElementById("volumenMusica").value);
      musicaFondo.currentTime = 0;
      musicaFondo.play().catch((err) => {
        console.log("Error al reproducir música:", err);
        setTimeout(() => {
          musicaFondo.play().catch(() => {});
        }, 1000);
      });
      
      document.body.addEventListener("click", contar);
      document.body.addEventListener("touchstart", contar);
      actualizarPanelEmblemas();
      contadorInfo.style.display = "block";
    }

    // ============================================================
    //  REINICIAR JUEGO
    // ============================================================
    function reiniciar(e) {
      e.stopPropagation();
      contador = 0;
      numero.textContent = contador;

      document.body.classList.remove("victoria", "ritmo", "temblor", "rojo", "blur", "temblorFinal");
      mensaje.classList.add("oculto");

      // Cancelar temporizador 666 si está activo
      if (temporizador666Interval) {
        clearInterval(temporizador666Interval);
        temporizador666Interval = null;
      }
      temporizador666.classList.add("oculto");
      temporizador666Activo = false;
      evento666Cancelado = false;
      temblorFinalActivo = false;

      // Detener todas las músicas
      musicaVictoria.pause();
      musicaVictoria.currentTime = 0;
      musica666.pause();
      musica666.currentTime = 0;
      musica666Reproducida = false;
      
      // Reiniciar música de fondo
      musicaFondo.currentTime = 0;
      musicaFondo.volume = parseFloat(document.getElementById("volumenMusica").value);
      musicaFondo.play().catch(() => {});

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      btnReiniciar.classList.add("oculto");

      tiempoClickRapido = [];
      tiempoClickUltra = [];
      clearTimeout(esperaPaciencia);
      esperaPaciencia = null;
      evento666Activado = false;
      musicaInterrumpida = false;
      juegoActivo = true;
      juegoTerminado = false;
      numero.classList.remove("oculto");
      contadorInfo.style.display = "block";
    }

    // ============================================================
    //  CONTROL DE VOLUMEN
    // ============================================================
    document.getElementById("volumenMusica").addEventListener("input", function() {
      const vol = parseFloat(this.value);
      musicaFondo.volume = vol;
      musicaVictoria.volume = vol;
      musica666.volume = vol;
    });

    document.getElementById("volumenSFX").addEventListener("input", function() {
      const vol = parseFloat(this.value);
      sonidosClick.forEach(s => s.volume = vol);
      sonidoFinal.volume = vol;
      sonidoEmblema.volume = vol;
      sonidoMisterio.volume = vol;
    });

    // ============================================================
    //  EVENT LISTENERS DE BOTONES
    // ============================================================
    btnEmpezar.addEventListener("click", iniciarJuego);
    btnReiniciar.addEventListener("click", reiniciar);
    document.getElementById("botonVerEmblemas").addEventListener("click", mostrarOcultarPanel);
    document.getElementById("botonConfiguracion").addEventListener("click", mostrarOcultarConfiguracion);

    // ============================================================
    //  REDIMENSIONAR CANVAS
    // ============================================================
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // ============================================================
    //  INICIALIZACIÓN
    // ============================================================
    actualizarPanelEmblemas();
    contadorInfo.style.display = "none";

    console.log("🎮 Clicker Raphástico - Contando de 10 en 10");
    console.log("🥇 Medalla de Bronce → Llegar a 1000 por primera vez");
    console.log("👹 666 → Temporizador de 5 segundos, si saltas se cancela");
    console.log("🏁 Meta Suprema → Completar todos los emblemas");
    console.log("🎵 Después del evento 666, la música de fondo se detiene hasta reiniciar");
  </script>
