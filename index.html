<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Contador Raphástico</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      transition: background 0.5s;
    }
    .oculto { display: none; }
    .temblor { animation: temblor 0.3s; }
    .temblorGlobal { animation: temblorGlobal 0.8s infinite; }
    .rojo { background-color: red !important; }
    .victoria { background-color: #00cc00 !important; color: black; }
    .ritmo { animation: vibrar 0.3s infinite ease-in-out; }
    #numero { margin-bottom: 10px; }
    #cuentaRegresiva {
      font-size: 40px;
      color: orangered;
      text-shadow: 1px 1px 4px black;
    }
    #mensajeVictoria {
      position: absolute;
      top: 20%;
      font-size: 80px;
      color: yellow;
      text-shadow: 4px 4px 0 black;
      animation: parpadeo 1s infinite;
      z-index: 10;
    }
    #emblemasVitrina {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      z-index: 5;
    }
    #notificacionEmblema {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-size: 22px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      color: gold;
      border: 2px solid gold;
      border-radius: 10px;
      display: none;
      animation: fadeout 3s ease-out forwards;
      z-index: 10;
    }
    #botonConfiguracion {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 24px;
      background: white;
      color: black;
      padding: 5px 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      z-index: 10;
    }
    #botonVerEmblemas {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 20px;
      background: white;
      color: black;
      padding: 5px 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      z-index: 10;
    }
    #panelEmblemas {
      position: fixed;
      top: 60px;
      right: 10px;
      background: rgba(0,0,0,0.95);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
      z-index: 9;
      border: 1px solid white;
      width: 300px;
    }
    #listaEmblemas {
      margin-bottom: 20px;
    }
    #panelConfiguracion {
      border-top: 1px solid white;
      padding-top: 10px;
    }
    .configItem {
      margin-bottom: 15px;
    }
    .configItem label {
      display: block;
      font-size: 16px;
      margin-bottom: 5px;
    }
    .configItem input[type="range"] {
      width: 100%;
    }
    .configItem button {
      font-size: 16px;
      padding: 5px 15px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    @keyframes parpadeo {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }
    @keyframes vibrar {
      0%,100% { transform: translate(0,0); }
      25% { transform: translate(3px,-3px); }
      50% { transform: translate(-3px,3px); }
      75% { transform: translate(3px,3px); }
    }
    @keyframes temblor {
      0%,100% { transform: translate(0,0); }
      25% { transform: translate(4px,-4px); }
      50% { transform: translate(-4px,4px); }
      75% { transform: translate(4px,4px); }
    }
    @keyframes temblorGlobal {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(8px, -8px); }
      50% { transform: translate(-8px, 8px); }
      75% { transform: translate(8px, 8px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes fadeout {
      0% { opacity: 1; }
      75% { opacity: 1; }
      100% { opacity: 0; display: none; }
    }
    button {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      padding: 10px 40px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
      z-index: 1;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="numero" class="oculto">0</div>
  <div id="cuentaRegresiva" class="oculto">5</div>
  <div id="mensajeVictoria" class="oculto">¡GANASTE!</div>

  <button id="empezar" onclick="iniciarJuego()">Empezar a jugar</button>
  <button id="reiniciar" class="oculto" onclick="reiniciar(event)">Volver a jugar</button>

  <button id="botonConfiguracion" onclick="mostrarOcultarPanel()" style="position: fixed; top: 10px; left: 10px; font-size: 24px; background: white; color: black; padding: 5px 15px; border-radius: 10px; border: none; cursor: pointer; z-index: 10;">
    ⚙
  </button>

  <button id="botonVerEmblemas" onclick="mostrarOcultarPanelEmblemas()" style="position: fixed; top: 10px; right: 10px; font-size: 20px; background: white; color: black; padding: 5px 15px; border-radius: 10px; border: none; cursor: pointer; z-index: 10;">
    Emblemas
  </button>

  <div id="panelEmblemas">
    <div id="listaEmblemas"></div>
    <div id="panelConfiguracion" class="oculto">
      <div class="configItem">
        <label for="volumenMusica">Volumen de Música:</label>
        <input type="range" id="volumenMusica" min="0" max="1" step="0.01" value="1" />
      </div>
      <div class="configItem">
        <label for="volumenSFX">Volumen de SFX:</label>
        <input type="range" id="volumenSFX" min="0" max="1" step="0.01" value="1" />
      </div>
      <div class="configItem">
        <button onclick="reiniciarEmblemas()">🔁 Reiniciar emblemas</button>
      </div>
    </div>
  </div>

  <div id="notificacionEmblema"></div>
  <div id="emblemasVitrina"></div>

  <!-- Audios -->
  <audio id="musicaFondo" src="fondo.mp3" loop preload="auto"></audio>
  <audio id="musica666" src="musica666.mp3" loop preload="auto"></audio>
  <audio id="musicaVictoria" src="victoria.mp3" loop preload="auto"></audio>
  <audio id="sonidoFinal" src="final.mp3" preload="auto"></audio>
  <audio id="sonidoEmblema" src="emblema.mp3" preload="auto"></audio>
  <audio id="sonidoMisterio" src="misterio.mp3" preload="auto"></audio>
  <audio id="sonidoCompletos" src="emblemas_completos.mp3" preload="auto"></audio>

  <!-- Sonidos de clic -->
  <audio id="click1" src="click1.mp3" preload="auto"></audio>
  <audio id="click2" src="click2.mp3" preload="auto"></audio>
  <audio id="click3" src="click3.mp3" preload="auto"></audio>
  <audio id="click4" src="click4.mp3" preload="auto"></audio>
  <audio id="click5" src="click5.mp3" preload="auto"></audio>
  <audio id="click6" src="click6.mp3" preload="auto"></audio>
  <audio id="click7" src="click7.mp3" preload="auto"></audio>
  <audio id="click8" src="click8.mp3" preload="auto"></audio>

  <!-- Canvas para confeti -->
  <canvas id="confetiCanvas"></canvas>

  <!-- Video del evento 666 -->
  <video id="video666" class="oculto">
    <source src="video666.mp4" type="video/mp4" />
  </video>

  <script>
let contador = 0;
let juegoActivo = false;
let clickActual = 0;
let tiempoClickRapido = [];
let victorias = 0;
let tiempoPaciencia = null;
let esperaPaciencia = null;
let emblemasObtenidos = {};
let emblemaFinalDesbloqueado = false;
const totalEmblemas = 7;

let evento666Activado = false;
let musicaInterrumpida = false;

const numero = document.getElementById("numero");
const mensaje = document.getElementById("mensajeVictoria");
const btnEmpezar = document.getElementById("empezar");
const btnReiniciar = document.getElementById("reiniciar");
const panelEmblemas = document.getElementById("panelEmblemas");
const cuenta = document.getElementById("cuentaRegresiva");
const canvas = document.getElementById("confetiCanvas");
const ctx = canvas.getContext("2d");

const sonidosClick = [click1, click2, click3, click4, click5, click6, click7, click8];
const musicaFondo = document.getElementById("musicaFondo");
const musica666 = document.getElementById("musica666");
const musicaVictoria = document.getElementById("musicaVictoria");
const sonidoFinal = document.getElementById("sonidoFinal");
const sonidoEmblema = document.getElementById("sonidoEmblema");
const sonidoCompletos = document.getElementById("sonidoCompletos");

const listaEmblemas = [
  "🥇 Medalla de Bronce",
  "⚡ Velocidad Loca",
  "💎 Diamante Triple",
  "🎮 Casi Casi Gamer",
  "🕒 Paciencia Infinita",
  "🏁 Meta Suprema",
  "👹 No Confíes En 666"
];

// Inicia el juego
function iniciarJuego() {
  btnEmpezar.classList.add("oculto");
  numero.classList.remove("oculto");
  juegoActivo = true;
  musicaFondo.volume = parseFloat(volumenMusica.value);
  musicaFondo.currentTime = 0;
  musicaFondo.play().catch(() => {});
  document.body.addEventListener("click", contar);
  cargarEmblemas();
  actualizarPanelEmblemas();
}

// Panel de configuración
function mostrarOcultarPanel() {
  panelEmblemas.style.display =
    panelEmblemas.style.display === "block" ? "none" : "block";
  if (panelEmblemas.style.display === "block") {
    document.getElementById("panelConfiguracion").classList.remove("oculto");
    actualizarPanelEmblemas();
  }
}

// Panel de emblemas
function mostrarOcultarPanelEmblemas() {
  panelEmblemas.style.display =
    panelEmblemas.style.display === "block" ? "none" : "block";
  if (panelEmblemas.style.display === "block") {
    document.getElementById("panelConfiguracion").classList.add("oculto");
    actualizarPanelEmblemas();
  }
}

// Actualiza lista de emblemas
function actualizarPanelEmblemas() {
  const lista = document.getElementById("listaEmblemas");
  lista.innerHTML = "<strong>🏅 Emblemas:</strong><br><br>";
  listaEmblemas.forEach(nombre => {
    lista.innerHTML += emblemasObtenidos[nombre]
      ? `✨ ${nombre}<br>`
      : `⛔ ${nombre}<br>`;
  });
}

// Control de volumen
volumenMusica.addEventListener("input", () => {
  musicaFondo.volume = parseFloat(volumenMusica.value);
  musica666.volume = parseFloat(volumenMusica.value);
  musicaVictoria.volume = parseFloat(volumenMusica.value);
});

volumenSFX.addEventListener("input", () => {
  sonidosClick.forEach(s => s.volume = parseFloat(volumenSFX.value));
  sonidoFinal.volume = parseFloat(volumenSFX.value);
  sonidoEmblema.volume = parseFloat(volumenSFX.value);
  sonidoCompletos.volume = parseFloat(volumenSFX.value);
});

// Cookies para emblemas
function guardarEmblemas() {
  document.cookie = "emblemas=" + JSON.stringify(emblemasObtenidos) + "; path=/; max-age=31536000";
}

function cargarEmblemas() {
  const match = document.cookie.match(/(?:^|;) ?emblemas=([^;]*)(?:;|$)/);
  if (match) {
    try {
      emblemasObtenidos = JSON.parse(decodeURIComponent(match[1]));
    } catch (e) {
      emblemasObtenidos = {};
    }
  }
}

function reiniciarEmblemas() {
  document.cookie = "emblemas=; path=/; max-age=0";
  emblemasObtenidos = {};
  emblemaFinalDesbloqueado = false;
  document.getElementById("emblemasVitrina").innerHTML = "";
  actualizarPanelEmblemas();
}
function mostrarVideo666() {
  const video = document.getElementById("video666");
  video.classList.remove("oculto");
  Object.assign(video.style, {
    position: "fixed",
    top: "0",
    left: "0",
    width: "100vw",
    height: "100vh",
    zIndex: "1000",
    objectFit: "cover"
  });

  // Pausar música normal
  musicaFondo.pause();
  if (window.musica666) musica666.pause();

  // Reproducir video
  video.play();
  video.onended = () => {
    video.classList.add("oculto");
    document.body.style.backgroundColor = "black";

    // Mostrar imagen final
    const imagenFinal = document.createElement("img");
    imagenFinal.src = "final666.png";
    Object.assign(imagenFinal.style, {
      position: "fixed",
      top: "50%",
      left: "50%",
      transform: "translate(-50%, -50%)",
      maxWidth: "90vw",
      maxHeight: "90vh",
      zIndex: "999",
      opacity: "0",
      transition: "opacity 2s ease-in-out"
    });

    document.body.appendChild(imagenFinal);

    // Sonido misterioso
    const sonido = document.getElementById("sonidoMisterio");
    sonido.currentTime = 0;
    sonido.volume = parseFloat(volumenSFX.value);
    sonido.play();

    // Fade-in de la imagen
    setTimeout(() => {
      imagenFinal.style.opacity = "1";
    }, 100);

    // Desbloquear emblema especial
    setTimeout(() => {
      desbloquearEmblema("👹 No Confíes En 666");
    }, 3000);

    // Volver al juego después de 8 segundos
    setTimeout(() => {
      imagenFinal.remove();
      numero.textContent = "670";
      contador = 670;
      if (!musicaInterrumpida) musicaFondo.play().catch(() => {});
    }, 8000);
  };
}
function reiniciar(e) {
  e.stopPropagation();
  contador = 0;
  numero.textContent = contador;

  // Quitar efectos visuales
  document.body.classList.remove("victoria", "ritmo", "temblorGlobal");
  mensaje.classList.add("oculto");

  // Resetear música
  musicaVictoria.pause();
  musicaVictoria.currentTime = 0;
  musicaFondo.currentTime = 0;
  musicaFondo.volume = parseFloat(volumenMusica.value);
  musicaFondo.play();

  // Limpiar confeti
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ocultar botón de reinicio
  btnReiniciar.classList.add("oculto");

  // Resetear variables
  tiempoClickRapido = [];
  clearTimeout(esperaPaciencia);
  esperaPaciencia = null;
  evento666Activado = false;
  musicaInterrumpida = false;

  // Mostrar número y reactivar juego
  numero.classList.remove("oculto");
  juegoActivo = true;
}

function lanzarConfeti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const confetis = [];

  // Crear partículas de confeti
  for (let i = 0; i < 250; i++) {
    confetis.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      r: Math.random() * 6 + 4,
      d: Math.random() * 10 + 10,
      color: `hsl(${Math.random() * 360}, 100%, 50%)`,
      tilt: Math.random() * 10 - 5,
      tiltAngle: 0
    });
  }

  // Animación del confeti
  function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let c of confetis) {
      ctx.beginPath();
      ctx.lineWidth = c.r;
      ctx.strokeStyle = c.color;
      ctx.moveTo(c.x + c.tilt, c.y);
      ctx.lineTo(c.x + c.tilt + c.r / 2, c.y + c.d);
      ctx.stroke();
      c.y += 4;
      c.tiltAngle += 0.1;
      c.tilt = Math.sin(c.tiltAngle) * 10;
    }
    requestAnimationFrame(animar);
  }

  animar();
}
  </script>
</body>
</html>
